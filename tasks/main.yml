---
# tasks file for headscale-install
#Headscale Debian Install. Redhat/Other TBC (Standalone Binaries).
- name: Check for Headscale Deb Install File.
  stat:
    path: /root/headscale.deb
  register: headscale_installer_info
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Download Headscale Deb File.
  ansible.builtin.get_url:
    url: https://github.com/juanfont/headscale/releases/download/v{{headscale_version}}/headscale_{{headscale_version}}_linux_{{headscale_serv_arch}}.deb
    dest: /root/headscale.deb
    mode: '0500'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
    - not headscale_installer_info.stat.exists

- name: Install Headscale from Deb File.
  ansible.builtin.apt:
    deb: "/root/headscale.deb"
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Check for Headscale Config File.
  stat:
    path: /etc/headscale/config.yaml
  register: headscale_config_info
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Download Headscale Config File if needed.
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/juanfont/headscale/main/config-example.yaml
    dest: /etc/headscale/config.yaml
    mode: '0700'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
    - not headscale_config_info.stat.exists

- name: Set server_url.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^server_url'
    line: 'server_url: https://{{ headscale_serv_url }}:443'
    backup: yes
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: server_url_set

- name: Set listen_addr.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^listen_addr'
    line: 'listen_addr: 0.0.0.0:443'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: listen_addr_set

- name: Set acme_email.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^acme_email'
    line: 'acme_email: {{ acme_email }}:443'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: acme_email_set

- name: Set letsencrypt_hostname.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^tls_letsencrypt_hostname:'
    line: 'tls_letsencrypt_hostname: "{{ headscale_serv_url }}"'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: letencrypt_hostname_set

- name: Set magic_dns.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^magic_dns'
    line: 'magic_dns: {{ magic_dns }}'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: magic_dns_set

- name: Set base_domain.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^  base_domain'
    line: '  base_domain: {{ base_domain }}:443'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: base_domain_set

- name: Set randomize_client_port.
  ansible.builtin.lineinfile:
    path: /etc/headscale/config.yaml
    regexp: '^randomize_client_port'
    line: 'randomize_client_port: {{ rndm_client_port }}'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
  register: client_port_set

- name: Reassign /etc/headscale to headscale user.
  ansible.builtin.file:
    path: /etc/headscale
    recurse: yes
    mode: '500'
    owner: headscale
    group: headscale
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Check Headscale is running
  ansible.builtin.systemd:
    name: "headscale.service"
  register: headscale_service_status
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- debug:
    var: headscale_service_status.status.ActiveState

- name: Restart+Enable Headscale Server with changes.
  ansible.builtin.service:
    name: headscale
    enabled: yes
    state: restarted
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true
    - headscale_service_status.status.ActiveState == 'inactive' or server_url_set.changed or listen_addr_set.changed or acme_email_set.changed or letencrypt_hostname_set.changed or magic_dns_set.changed or base_domain_set.changed or client_port_set.changed
  register: headscale_server_started

- name: Create PAK for Groups/Tags.
  ansible.builtin.shell: headscale preauthkeys create --tags tag:"{{ headscale_group }}" --expiration "{{ pak_expiry }}" --reusable
  register: pak
  run_once: true
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Show PAK.stdout
  ansible.builtin.debug:
    var: pak
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Share key with all hosts
  ansible.builtin.set_fact:
    pak.stdout: "{{ hostvars[lighthouse]['pak']['stdout'] }}"
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

- name: Show PAK Token
  ansible.builtin.debug:
    msg: '{{ PAK }}'
  when:
    - ansible_os_family == "Debian"
    - headscale_server == true

