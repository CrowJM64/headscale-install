---
# defaults file for headscale-install
# Headscale Releases: https://github.com/juanfont/headscale/releases
HEADSCALE_SERVER: false # Set to true in host var of Headscale Master Server (true/false)
HEADSCALE_VERSION: '0.28.0' # See above URL for latest releases. e.g. "X.Y.Z"
HEADSCALE_SERV_ARCH: 'amd64' # Your system architecture, e.g. "amd64"
HEADSCALE_SERV_URL: 'headscale.example.com' # Publicly Accessible URL of the Headscale Server. Must be accessible on 80/tcp and 443/tcp for self-signing with LetsEncrypt. Variable also used for tls_letsencrypt_hostname, so do not include https://
ACME_EMAIL: '' # Email to register with ACME provider
MAGIC_DNS: 'true' # Whether to use [MagicDNS](https://tailscale.com/docs/features/magicdns) (true/false)
BASE_DOMAIN: 'hs.example.com' # This domain MUST be different from the HEADSCALE_SERV_URL/server_url domain. Local between Head/tailscale devices.
RNDM_CLIENT_PORT: 'false' # Enabling this option makes devices prefer a random port for WireGuard traffic over the default static port 41641 (true/false)
HEADSCALE_GROUPS: # Must be lowercase for Headscale Tags(Groups).
  - 'servers'
#  - 'workstations' 
#  - 'example'
PAK_EXPIRY: 10m # Expiry time for PAK. Default: 10m (1m/1h/1d)
HEADSCALE_CLIENT: true # Set to true in host var of Headscale Master Server, and other servers you do not want connected via Tailscale. (true/false)