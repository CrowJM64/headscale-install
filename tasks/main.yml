---
# tasks file for headscale-install
#Headscale Debian Install. Redhat/Other TBC (Standalone Binaries).
- name: Check for Headscale Installation.
  ansible.builtin.stat:
    path: /usr/bin/headscale
  register: headscale_installer_info

- name: Download Headscale
  ansible.builtin.get_url:
    url: https://github.com/juanfont/headscale/releases/download/v{{headscale_version}}/headscale_{{headscale_version}}_linux_{{headscale_serv_arch}}
    dest: /usr/bin/headscale
    mode: '0755'
  when:
    - not headscale_installer_info.stat.exists

- name: Add the Headscale group
  ansible.builtin.group:
    name: headscale
    state: present

- name: Add the Headscale user
  ansible.builtin.user:
    name: headscale
    shell: /usr/sbin/nologin
    system: true

- name: Create Headscale Config Directory
  ansible.builtin.file:
    path: /etc/headscale
    state: directory

- name: Copy Headscale Conf to Server
  ansible.builtin.template:
    src: headscale-config.yaml
    dest: /etc/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: '0550'
    backup: true
  register: headscale_config

- name: Copy Headscale ACL Conf to Server
  ansible.builtin.template:
    src: acl.json
    dest: /etc/headscale/acl.json
    owner: headscale
    group: headscale
    mode: '0550'
    backup: true
  register: acl_json

- name: Copy Headscale Service to Server
  ansible.builtin.template:
    src: headscale.service
    dest: /etc/systemd/system/headscale.service
    owner: headscale
    group: headscale
    mode: '0550'
    backup: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart+Enable Headscale Server with changes.
  ansible.builtin.service:
    name: headscale
    enabled: yes
    state: restarted
  register: headscale_server_started
  when: acl_json.changed or headscale_config.changed

- name: Check if PAK code exists
  ansible.builtin.stat:
    path: /root/headscale-{{ headscale_group }}-pak
  register: pak_token

- name: Remove old PAK code
  ansible.builtin.file:
    path: /root/headscale-{{ headscale_group }}-pak
    state: absent
  when:
    - pak_token.stat.exists
    - recreate_pak is true

- name: Create PAK for Groups/Tags.
  ansible.builtin.shell: headscale preauthkeys create --tags tag:"{{ headscale_group }}" --expiration "{{ pak_expiry }}" --reusable >> /root/headscale-{{ headscale_group }}-pak
  register: pak
  when: not pak_token.stat.exists