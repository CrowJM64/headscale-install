# Tailscale Configuration
- name: Download Tailscale Install Script.
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /root/tailscale.sh
    mode: '0500'
  when:
    - headscale_client == true
    - headscale_server_started is succeeded

- name: Check if Tailscale is installed
  ansible.builtin.systemd:
    name: "tailscale.service"
  register: tailscale_status
  when:
    - headscale_client == true
    - headscale_server_started is succeeded

- name: Install Tailscale
  ansible.builtin.shell: /root/tailscale.sh
  when:
    - headscale_client == true
    - headscale_server_started is succeeded
    - tailscale_status.status.ActiveState != 'active'

#- name: Show TailScale Joining
#  ansible.builtin.debug:
#    msg: 'tailscale up --login-server https://{{ headscale_serv_url }} --auth-key {{ pak_token }}'
#  when:
#    - headscale_client == true
#    - headscale_server_started is succeeded

- name: Join Client to Headscale
  ansible.builtin.shell: 'tailscale up --login-server https://{{ headscale_serv_url }} --auth-key {{ pak_token }}'
  when:
    - headscale_client == true
    - headscale_server_started is succeeded